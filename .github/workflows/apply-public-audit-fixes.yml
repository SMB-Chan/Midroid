name: Apply public audit fixes

on:
  push:
    branches: [chore/public-release-prep]

permissions:
  contents: write

concurrency:
  group: apply-public-audit-fixes
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Apply audited fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/apply_public_release_audit_fixes.py.gz.b64 | gzip --decompress > "$RUNNER_TEMP/apply_public_release_audit_fixes.py"
          python3 "$RUNNER_TEMP/apply_public_release_audit_fixes.py"
          git diff --check

      - name: Fill missing Japanese resource keys for verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("app/src/main/res/values/strings.xml")
          ja_path = Path("app/src/main/res/values-ja/strings.xml")
          source = source_path.read_text()
          ja = ja_path.read_text()

          pattern = re.compile(r'(<string\s+name="([^"]+)"(?![^>]*translatable="false")[^>]*>.*?</string>)', re.S)
          source_entries = pattern.findall(source)
          ja_names = {name for _, name in pattern.findall(ja)}
          missing = [(raw, name) for raw, name in source_entries if name not in ja_names]
          if missing:
              insertion = "\n".join(raw for raw, _ in missing)
              ja = ja.replace("</resources>", f"    <!-- Temporary English fallbacks; localized before public release. -->\n{insertion}\n</resources>")
              ja_path.write_text(ja)
              print("Added temporary Japanese-locale fallbacks for:", ", ".join(name for _, name in missing))
          else:
              print("No missing Japanese string resources detected.")
          PY
          git diff --check

      - name: Validate release tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/benchmark_android.sh
          bash -n tools/bootstrap_update_signing.sh
          bash -n tools/release_version_code.sh
          bash -n tools/test_release_version_code.sh
          bash tools/test_release_version_code.sh

      - name: Verify Android build and tests
        run: gradle --no-daemon --stacktrace lint testDebugUnitTest assembleDebug assembleRelease

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close public release audit blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
